version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"      # 程序连接端口
      - "15672:15672"    # 管理界面
    volumes:
      - ./rabbitmq-data:/var/lib/rabbitmq  # 数据持久化
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped